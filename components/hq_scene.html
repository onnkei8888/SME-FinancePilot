<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif}
#scene{width:100%;height:100%;display:block}
#hint{position:absolute;left:16px;top:12px;color:#c5d7ea;font-size:12px;letter-spacing:.4px;background:rgba(7,17,31,.72);padding:8px 11px;border:1px solid #29435f;border-radius:10px}
#label{position:absolute;right:16px;bottom:14px;color:#dcecff;font-size:12px;background:rgba(7,17,31,.78);padding:9px 12px;border:1px solid #29435f;border-radius:10px;max-width:260px}
</style>
</head>
<body>
<div id="hint">DRAG TO ROTATE · SCROLL TO ZOOM · CLICK A BUILDING</div>
<div id="label">FINANCE CORE · Coordinating five specialist agents</div>
<canvas id="scene"></canvas>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
{
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111f);
scene.fog=new THREE.Fog(0x07111f,22,55);
const camera=new THREE.PerspectiveCamera(42,canvas.clientWidth/canvas.clientHeight,.1,100);
camera.position.set(15,13,19);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.target.set(0,1.3,0); controls.minDistance=10; controls.maxDistance=32;
scene.add(new THREE.HemisphereLight(0xa9d9ff,0x18243b,2.1));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(8,15,10);key.castShadow=true;scene.add(key);
const fill=new THREE.PointLight(0x38d9c0,35,30);fill.position.set(-7,7,-5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x0b1b2d,roughness:.88}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.12;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(36,36,0x24425d,0x183149);grid.position.y=-.1;scene.add(grid);
const group=new THREE.Group();scene.add(group);
const clickable=[];
function mat(color,metal=0.25,rough=.48,emissive=0x000000){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough,emissive,emissiveIntensity:.25})}
const glass=mat(0x173d59,.55,.22,0x071c2b), gold=mat(0xe3b86d,.55,.3), cyan=mat(0x36d7c2,.35,.3,0x0a4c43), blue=mat(0x4d8fe8,.4,.3), violet=mat(0x9679e8,.4,.3), coral=mat(0xf18b70,.35,.35), concrete=mat(0x243b53,.25,.7);
function box(parent,x,y,z,w,h,d,material){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,x,y,z,rt,rb,h,material,segments=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function tower(name,desc,x,z,color,style){
 const g=new THREE.Group();g.position.set(x,0,z);group.add(g);
 box(g,0,.12,0,3.6,.24,3.2,concrete);
 const bodyMat=mat(color,.38,.32);
 if(style===0){
   box(g,0,1.45,0,2.0,2.55,1.9,bodyMat);
   box(g,2,1.0,0,.42,1.8,1.7,glass);
   cylinder(g,0,3.05,0,.95,.95,.22,gold,8);
   cylinder(g,0,3.35,0,.14,.14,.45,gold,8);
 }else if(style===1){
   for(let i=0;i<4;i++){let w=2.6-i*.34;box(g,0,.55+i*.55,0,w,.48,2.25,bodyMat);}
   box(g,0,2.85,0,.5,.25,.5,gold);
 }else if(style===2){
   cylinder(g,0,1.45,0,1.25,1.25,2.5,bodyMat,10);
   cylinder(g,0,2.8,0,.78,.78,.22,gold,10);
   for(let i=0;i<8;i++){let a=i*Math.PI/4;box(g,Math.cos(a)*1.0,1.45,Math.sin(a)*1.0,.12,2.05,.12,gold);}
 }else if(style===3){
   box(g,0,1.1,0,2.6,1.8,2.2,bodyMat);
   box(g,0,2.25,0,2.0,.5,1.7,glass);
   const roof=new THREE.Mesh(new THREE.ConeGeometry(1.55,.9,4),gold);roof.position.y=2.95;roof.rotation.y=Math.PI/4;roof.castShadow=true;g.add(roof);
 }else{
   cylinder(g,0,1.25,0,1.35,1.35,2.2,bodyMat,6);
   cylinder(g,0,2.45,0,.95,.95,.25,glass,6);
   cylinder(g,0,2.75,0,.55,.55,.35,gold,6);
   for(let i=0;i<3;i++){let a=i*2*Math.PI/3;box(g,Math.cos(a)*1.5,.55,Math.sin(a)*1.5,.5,.9,.5,bodyMat);}
 }
 // luminous windows / details
 for(let row=0;row<3;row++) for(let col=-1;col<=1;col++){
   box(g,col*.48,.55+row*.48,1.02,.18,.22,.035,cyan);
 }
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.9,.025,6,48),mat(color,.4,.3,color));ring.rotation.x=Math.PI/2;ring.position.y=.03;g.add(ring);
 g.userData={name,desc,baseY:0};
 clickable.push(g);
 const badge=cylinder(group,x,3.85,z,.17,.17,.06,mat(color,.2,.3,color),16);
 badge.rotation.x=Math.PI/2;
}
tower("FINANCE TOWER","Finance Agent · Analyses revenue, COGS, operating expenses and margins.",-5,-3,0x4d9be8,0);
tower("CASH FLOW HARBOUR","Cash Flow Agent · Monitors liquidity, net cash movement and estimated runway.",0,-5,0x36d7c2,1);
tower("RISK OBSERVATORY","Risk Agent · Detects operating deficit, weak cash buffers and cost-ratio warnings.",5,-2,0xf0b65f,2);
tower("STRATEGY LAB","Strategy Agent · Compares cost-control, sales-growth and balanced scenarios.",-3,4,0x9b85ed,3);
tower("DECISION PAVILION","Decision Agent · Synthesises evidence and waits for owner approval.",4,4,0xf18b70,4);
// central core
const core=new THREE.Group();core.position.set(0,0,0);group.add(core);
cylinder(core,0,.2,0,1.35,1.35,.4,gold,8);
const coreMesh=new THREE.Mesh(new THREE.OctahedronGeometry(1.05,1),mat(0x3be0cb,.5,.2,0x0c665c));coreMesh.position.y=1.65;coreMesh.castShadow=true;core.add(coreMesh);
const halo=new THREE.Mesh(new THREE.TorusGeometry(1.5,.045,8,64),gold);halo.position.y=1.65;halo.rotation.x=Math.PI/2;core.add(halo);
for(let i=0;i<5;i++){const a=i*2*Math.PI/5;const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(Math.cos(a)*1.5,.2,Math.sin(a)*1.5),new THREE.Vector3(Math.cos(a)*2.7,1.8,Math.sin(a)*2.7),new THREE.Vector3(Math.cos(a)*3.5,.15,Math.sin(a)*3.5));const pts=curve.getPoints(32);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x347c99,transparent:true,opacity:.6}));group.add(line);}
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
 if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>7)return;
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(clickable,true);
 if(hits.length){let obj=hits[0].object;while(obj.parent && !obj.userData.name)obj=obj.parent;if(obj.userData.name)document.getElementById('label').textContent=obj.userData.name+" · "+obj.userData.desc;}
});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
window.addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);coreMesh.rotation.y+=.004;coreMesh.rotation.x+=.002;halo.rotation.z+=.003;controls.update();renderer.render(scene,camera);}
animate();
}
</script>
</body>
</html>
